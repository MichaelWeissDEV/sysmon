name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSYSMON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke tests
        run: |
          ./build/sysmon --version
          ./build/sysmon --help
          ./build/sysmon --once --no-tui

      - name: JSON output is parseable
        run: ./build/sysmon --json | python3 -m json.tool > /dev/null

      - name: Install smoke test
        run: |
          cmake --install build --prefix "$PWD/stage"
          ./stage/bin/sysmon --version

  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -a
          uname -m
          sw_vers
          clang++ --version
          cmake --version

      - name: Verify architecture
        run: test "$(uname -m)" = "arm64"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSYSMON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke tests
        run: |
          ./build/sysmon --version
          ./build/sysmon --help
          ./build/sysmon --once --no-tui

      - name: Install smoke test
        run: |
          cmake --install build --prefix "$PWD/stage"
          ./stage/bin/sysmon --version

  macos-intel:
    name: macOS (Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -a
          uname -m
          sw_vers
          clang++ --version
          cmake --version

      - name: Verify architecture
        run: test "$(uname -m)" = "x86_64"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSYSMON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke tests
        run: |
          ./build/sysmon --version
          ./build/sysmon --help
          ./build/sysmon --once --no-tui

      - name: Install smoke test
        run: |
          cmake --install build --prefix "$PWD/stage"
          ./stage/bin/sysmon --version

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DSYSMON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: CLI smoke tests
        run: |
          .\build\Debug\sysmon.exe --version
          .\build\Debug\sysmon.exe --help
          .\build\Debug\sysmon.exe --once --no-tui

      - name: JSON output is parseable
        shell: pwsh
        run: |
          .\build\Debug\sysmon.exe --json | ConvertFrom-Json | Out-Null
          Write-Host "JSON parsed successfully"

  windows-mingw:
    name: Windows (MinGW cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Generate version header
        run: cmake -S . -B build -DBUILD_TESTING=OFF

      - name: Cross-compile
        run: |
          x86_64-w64-mingw32-g++-posix -std=c++20 -O2 \
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wno-sign-conversion -Werror \
            -DWIN32_LEAN_AND_MEAN -DNOMINMAX -D_WIN32_WINNT=0x0601 \
            -I include -I build/include src/*.cpp -o sysmon.exe \
            -liphlpapi -lpsapi -lws2_32 -lpowrprof -lwtsapi32 -ldxgi -lole32 -static

  sanitizers:
    name: Sanitizers (Linux, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
          -DSYSMON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          ./build/sysmon --version
          ./build/sysmon --once --no-tui

  documentation:
    name: Documentation (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build Sphinx docs (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

      - name: Check links
        run: sphinx-build -b linkcheck docs/source docs/_build/linkcheck